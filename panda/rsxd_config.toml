# =============================================================================
#  RSXD SCAN LOGGER  --  configuration
#  Diamond Light Source, beamline I10 / RASOR
# =============================================================================
#  Plain text. Edit with Notepad. Restart the app for changes to take effect.
#
#  Windows paths: use SINGLE quotes 'C:\like\this'  (no backslash escaping).
#  Double quotes would need doubled backslashes -- avoid them for paths.
# =============================================================================


# ── Grid geometry ────────────────────────────────────────────────────────────
# The columns of the workbook grid: angle of the polarisation analyser.
[grid]
analyser_angles_deg = [-90, -75, -60, -45, -30, -15, 0, 15, 30, 45, 60, 75, 90]

# One workbook is written per (peak, temperature) pair.
# Nominal 300 K -> 10 K in ~20 K steps. Change freely; nothing is hardcoded.
temperatures_K = [300, 280, 260, 240, 220, 200, 180, 160, 140, 120, 100, 80, 60, 40, 20, 10]


# ── Peaks ────────────────────────────────────────────────────────────────────
#   "label shown in the app" = "string used in the .xlsx filename"
# Order here is the order in the app's peak selector.
[peaks]
"Co-tau" = "CoTau"
"Fe-tau" = "FeTau"
"Co2"    = "Co2"
"Fe2"    = "Fe2"


# ── Polarisation channels ────────────────────────────────────────────────────
# Group label  =  [ row labels, in the order they appear in the workbook ]
# This IS the corrected grouping: p / n are circular, LH / LV are linear.
# Row order here == row order in the exported .xlsx (rows 3,4,5,6).
[polarisation_groups]
"Circular dichroism" = ["p", "n"]
"Linear dichroism"   = ["LH", "LV"]


# ── Paths ────────────────────────────────────────────────────────────────────
# Both are also editable in the app; the app writes changes back here, so they
# are remembered between sessions.
#
#   output_dir  where the .xlsx workbooks and the cumulative CSV are written.
#               Empty string = an "output" folder next to this config file.
#
#   dat_dir     the local folder you WinSCP the raw data into.
#               Empty string, or a folder that does not exist, simply disables
#               the .dat presence check. The app carries on working.
[paths]
output_dir = ''
dat_dir = ''

# Filename patterns for the raw .dat files. {scan} is the scan number,
# with no zero padding. Every pattern in this list is tried; the scan counts
# as found if ANY of them matches.
#
# NOTE: real I10/RASOR files on this PC are named  i10-1-64719.dat
#       (the "-1-" is the entry index). The plain  i10-64719.dat  form is
#       kept as a fallback in case the naming changes.
dat_filename_patterns = ["i10-1-{scan}.dat", "i10-{scan}.dat"]


# ── Cumulative long-format CSV ───────────────────────────────────────────────
# This is the interface to the analysis scripts and to the phase-2 UI.
# The column set is FIXED -- do not change it.
[csv]
filename = "rsxd_scan_log.csv"
